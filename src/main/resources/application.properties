spring.application.name=fleettrack
server.port=2424

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/fleettrack
spring.datasource.username=fleettrack
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type = redis

# Server

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

logging.level.org.springframework.security=TRACE

# ---- FleetTrack custom settings ----
# Maintenance reminders (Spring cron: sec min hour day month weekday)
app.maintenance.reminder-days=3
app.maintenance.reminder-cron=0 0 8 * * *

# Cleanup of old completed maintenance records
app.cleanup.cron=0 30 2 * * *
app.cleanup.completed-maintenance-retention-days=90

# Redis pub/sub notifications
app.notifications.channel=fleet.notifications
app.notifications.recent-key=fleet:notifications:recent

# WebSocket (comma separated origin patterns; restrict in production)
app.websocket.allowed-origins=*
